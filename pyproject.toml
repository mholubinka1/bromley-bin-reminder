[project]
name = "bromley-bin-reminder"
version = "0.1.0"
description = ""
authors = [{ name = "Matt Holubinka", email = "meholubinka@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3,<5.0.0",
    "requests>=2.33.1,<3.0.0",
    "selenium>=4.43.0,<5.0.0",
    "lxml[html-clean]>=6.0.4,<7.0.0",
    "schedule>=1.2.2,<2.0.0",
    "pytz>=2026.1,<2027.0",
    "webdriver-manager>=4.0.2,<5.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[dependency-groups]
dev = [
    "isort>=8.0.1,<10.0.0",
    "black>=26.3.1,<27.0.0",
    "mypy>=1.20.1,<3.0.0",
    "ruff>=0.15.10,<0.17.0",
    "pre-commit>=4.5.1,<5.0.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
ignore = ["I001"]  # isort hook is the source of truth for import sorting
